<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias — Nestor Arbona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --text: #ffffff;
    --muted: #a0a0a0;
    --accent: #ffffff;
    --line: #262626;
    --card-bg: #171717;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  ::selection {
    background: #ffde00;
    color: #111111;
  }

  html {
    background: var(--bg);
  }

  body {
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.35) 65%, rgba(0, 0, 0, 0) 100%);
    z-index: 100;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    margin-left: 3rem;
  }

  .logo img {
    height: 56px;
    width: auto;
    display: block;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7));
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 2rem;
  }

  nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.95rem;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    transition: color 0.2s ease;
  }

  nav a:hover { color: #ffde00; }

  #app {
    position: fixed;
    inset: 0;
    z-index: -1;
    touch-action: none;
  }

  #canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .thanks {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6rem 2rem;
    max-width: 640px;
    margin: 0 auto;
  }

  .thanks .icon {
    font-size: 2.5rem;
    margin-bottom: 1.5rem;
  }

  .thanks h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
  }

  .thanks p {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 2rem;
  }

  .btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 999px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--text);
    color: var(--bg);
    transition: opacity 0.2s ease;
  }

  .btn:hover { opacity: 0.85; }

  footer {
    position: relative;
    text-align: center;
    padding: 2.5rem 2rem;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--line);
  }

  .framer-credit {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.7rem;
    color: var(--muted);
    text-decoration: none;
    opacity: 0.7;
    transition: opacity 0.2s ease;
  }

  .framer-credit:hover { opacity: 1; }

  @media (max-width: 600px) {
    header { padding: 1.2rem 1.2rem; }
    .logo { margin-left: 0; }
    .logo img { height: 42px; }
    nav ul { gap: 1rem; }
    nav a { font-size: 0.8rem; }
  }

  #preloader {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #preloader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  #preloader-count {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #ffffff;
  }

  body.loading {
    overflow: hidden;
  }
</style>
</head>
<body>

<div id="preloader">
  <span id="preloader-count">0%</span>
</div>
<script>
  if (sessionStorage.getItem('visited')) {
    document.getElementById('preloader').style.display = 'none';
  } else {
    document.body.classList.add('loading');
  }
</script>

<div id="app">
  <canvas id="canvas"></canvas>
</div>

<header>
  <a href="index.html" class="logo"><img src="Assets/N mk1-02.png" alt="Nestor Arbona"></a>
  <nav>
    <ul>
      <li><a href="sobre-mi.html">Quién soy</a></li>
      <li><a href="index.html#portfolio">Portfolio</a></li>
      <li><a href="index.html#contacto">Contacto</a></li>
    </ul>
  </nav>
</header>

<section class="thanks">
  <div class="icon">✓</div>
  <h1>¡Gracias por tu mensaje!</h1>
  <p>Lo he recibido correctamente y te responderé lo antes posible.</p>
  <a href="index.html" class="btn">Volver al inicio</a>
</section>

<footer>
  © 2026 Nestor Arbona. Todos los derechos reservados.
  <a class="framer-credit" target="_blank" href="https://www.framer.com/@kevin-levron/">Framer Component</a>
</footer>

<script>
  if (document.body.classList.contains('loading')) {
    const preloader = document.getElementById('preloader');
    const counter = document.getElementById('preloader-count');
    let progress = 0;

    const tick = () => {
      progress += Math.random() * 8 + 2;
      if (progress >= 100) {
        progress = 100;
        counter.textContent = '100%';
        preloader.classList.add('hidden');
        document.body.classList.remove('loading');
        sessionStorage.setItem('visited', 'true');
        return;
      }
      counter.textContent = Math.floor(progress) + '%';
      setTimeout(tick, 80);
    };

    tick();
  }
</script>

<script type="module">
  // Licencia CC BY-NC-SA 4.0 — Attribution-NonCommercial-ShareAlike
  // Componente original: https://www.framer.com/@kevin-levron/
  import TubesCursor from "https://cdn.jsdelivr.net/npm/threejs-components@0.0.19/build/cursors/tubes1.min.js"

  const app = TubesCursor(document.getElementById('canvas'), {
    tubes: {
      colors: ["#f967fb", "#53bc28", "#6958d5"],
      lights: {
        intensity: 200,
        colors: ["#83f36e", "#fe8a2e", "#ff008a", "#60aed5"]
      }
    }
  })

  document.body.addEventListener('click', () => {
    const colors = randomColors(3)
    const lightsColors = randomColors(4)
    app.tubes.setColors(colors)
    app.tubes.setLightsColors(lightsColors)
  })

  function randomColors(count) {
    return new Array(count)
      .fill(0)
      .map(() => "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'))
  }
</script>
</body>
</html>
